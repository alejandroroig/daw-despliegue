services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: escaparate
      POSTGRES_USER: escaparate
      POSTGRES_PASSWORD: escaparate
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escaparate -d escaparate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
